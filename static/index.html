<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoBridge · TikTok 多店铺履约</title>
  <script src="/static/tailwind-3.4.17.js"></script>
  <script src="/static/vue.global.prod.js"></script>
  <style>
    [v-cloak] { display: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">
  <div id="app" v-cloak>
    <header class="bg-white border-b border-slate-200 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center gap-3 h-16">
        <span class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold shadow-md shadow-indigo-100">EB</span>
        <div>
          <strong class="text-xl tracking-tight text-slate-900">EchoBridge</strong>
          <p class="text-xs text-slate-500">TikTok 多店铺履约工作台</p>
        </div>
      </div>
    </header>
    <main class="max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
      <!-- Simulated fulfillment workflow -->
      <section class="space-y-6">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">跨店铺面单打印</h1>
          <p class="text-sm text-slate-500 mt-1">20 家美国店铺 · 洛杉矶共享仓库 · TikTok Shipping / USPS</p>
        </div>
        <div class="bg-amber-50 border border-amber-200 text-amber-900 rounded-xl px-4 py-3 text-sm">
          模拟订单与面单，仅用于验证分类和排版。PDF 无有效邮资，下载后可预览；本页不会向打印机发送任务。
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-5 space-y-4 shadow-xs">
          <div class="flex flex-wrap items-end gap-4">
            <label class="text-sm text-slate-600">发货日期（洛杉矶）
              <input type="date" v-model="shippingDate" :disabled="shippingBusy" required class="block mt-1 bg-white border border-slate-300 rounded-lg px-3 py-2 text-slate-800">
            </label>
            <div class="flex flex-wrap gap-2">
              <button @click="selectShippingShops('all')" :disabled="shippingBusy" class="px-3 py-2 border border-slate-200 rounded-lg text-sm hover:bg-indigo-50">全部店铺</button>
              <button @click="selectShippingShops('first-two')" :disabled="shippingBusy" class="px-3 py-2 border border-slate-200 rounded-lg text-sm hover:bg-indigo-50">前两家示例店</button>
              <button @click="shippingSelection = []" :disabled="shippingBusy" class="px-3 py-2 border border-slate-200 rounded-lg text-sm hover:bg-slate-50">清空选择</button>
            </div>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
            <label v-for="s in shippingShops" :key="s.shop_id" class="flex gap-2 items-center border rounded-lg px-3 py-2 text-sm cursor-pointer" :class="shippingSelection.includes(s.shop_id) ? 'border-indigo-300 bg-indigo-50 text-indigo-800' : 'border-slate-200 text-slate-600'">
              <input type="checkbox" v-model="shippingSelection" :value="s.shop_id" :disabled="shippingBusy" class="accent-indigo-600">
              {{ s.name }}
            </label>
          </div>
          <div class="flex flex-wrap gap-3 items-center justify-between">
            <span class="text-sm text-slate-500">已选 {{ shippingSelection.length }} 家店铺</span>
            <button @click="prepareShippingBatch" :disabled="shippingBusy || !shippingDate || !shippingSelection.length" class="bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-50 px-4 py-2 rounded-lg text-sm font-medium">
              {{ shippingBusy ? '正在整理订单…' : '生成分类打印批次' }}
            </button>
          </div>
          <p v-if="shippingError" role="alert" class="text-sm text-rose-700">{{ shippingError }}</p>
          <button v-if="!shippingShops.length && shippingError" @click="fetchShippingShops" class="text-sm text-indigo-700 underline">重新加载店铺</button>
        </div>
        <template v-if="shippingBatch">
          <div v-if="shippingSelectionChanged" class="bg-indigo-50 border border-indigo-200 rounded-xl p-3 text-sm text-indigo-800">筛选条件已改变，下面仍为上次生成的批次。请重新生成以更新结果。</div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white border border-slate-200 rounded-xl p-4"><small class="text-slate-500">包裹 / 面单页数</small><p class="text-2xl font-semibold text-slate-900">{{ shippingBatch.package_count }}</p></div>
            <div class="bg-white border border-slate-200 rounded-xl p-4"><small class="text-slate-500">商品总件数</small><p class="text-2xl font-semibold text-slate-900">{{ shippingBatch.unit_count }}</p></div>
            <div class="bg-white border border-slate-200 rounded-xl p-4"><small class="text-slate-500">打印分类</small><p class="text-2xl font-semibold text-slate-900">{{ shippingBatch.groups.length }}</p></div>
            <div class="bg-white border border-slate-200 rounded-xl p-4"><small class="text-slate-500">排除包裹</small><p class="text-2xl font-semibold text-slate-900">{{ shippingExcluded.length }}</p></div>
          </div>
          <div class="bg-white border border-slate-200 rounded-xl shadow-xs overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex flex-wrap gap-3 items-center justify-between">
              <div><h2 class="font-semibold text-slate-900">{{ shippingPreparedDate }} · 分类结果</h2><p class="text-xs text-slate-500 mt-1">每个包裹只生成一页面单，混合商品单独成组；底部说明为该包裹的 SKU 与数量。</p></div>
              <a v-if="shippingBatch.package_count" :href="shippingPdfUrl()" target="_blank" rel="noopener" class="px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm">预览 / 下载全部 PDF</a>
            </div>
            <div class="overflow-x-auto"><table class="w-full text-sm text-left">
              <thead class="bg-slate-50 text-slate-500"><tr><th class="px-4 py-3">商品分类</th><th class="px-4 py-3">面单页数</th><th class="px-4 py-3">商品件数</th><th class="px-4 py-3">拣货汇总</th><th class="px-4 py-3">打印文件</th></tr></thead>
              <tbody class="divide-y divide-slate-100"><tr v-for="group in shippingBatch.groups" :key="group.group_id">
                <td class="px-4 py-3 font-semibold text-indigo-800">{{ group.group_id === 'mixed' || group.sku === 'mixed' ? '混合商品' : group.sku }}</td>
                <td class="px-4 py-3">{{ group.package_count }}</td><td class="px-4 py-3">{{ group.unit_count }}</td>
                <td class="px-4 py-3"><span v-for="item in group.items" :key="item.sku" class="block">{{ item.sku }} × {{ item.quantity }}</span></td>
                <td class="px-4 py-3"><a :href="shippingPdfUrl(group.group_id)" target="_blank" rel="noopener" class="text-indigo-700 hover:underline">预览 / 下载 PDF</a></td>
              </tr></tbody>
            </table></div>
            <p v-if="!shippingBatch.package_count" class="p-4 text-sm text-slate-500">本批次没有可下载的面单。</p>
          </div>
          <details v-if="shippingExcluded.length" class="bg-white border border-slate-200 rounded-xl p-4 text-sm">
            <summary class="cursor-pointer font-medium text-slate-700">查看已排除的 {{ shippingExcluded.length }} 个包裹</summary>
            <ul class="mt-3 space-y-2 text-slate-500"><li v-for="(item, index) in shippingExcluded" :key="index">{{ item.package_id || item.order_id || '包裹' }} · {{ formatShippingExclusion(item.reason || item.status) }}</li></ul>
          </details>
        </template>
      </section>

    </main>
  </div>
  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const shippingShops = ref([]);
        const shippingSelection = ref([]);
        const shippingDate = ref(new Intl.DateTimeFormat('en-CA', {
          timeZone: 'America/Los_Angeles',
          year: 'numeric', month: '2-digit', day: '2-digit'
        }).format(new Date()));
        const shippingBatch = ref(null);
        const shippingBusy = ref(false);
        const shippingError = ref('');
        const shippingPreparedDate = ref('');
        const shippingPreparedShops = ref([]);

        const shippingExcluded = computed(() => {
          const excluded = shippingBatch.value?.excluded;
          return Array.isArray(excluded) ? excluded : [];
        });
        const shippingSelectionChanged = computed(() => {
          const selected = [...shippingSelection.value].sort().join(',');
          const prepared = [...shippingPreparedShops.value].sort().join(',');
          return shippingDate.value !== shippingPreparedDate.value || selected !== prepared;
        });

        async function fetchShippingShops() {
          shippingError.value = '';
          try {
            const response = await fetch('/api/simulation/shops');
            if (!response.ok) throw new Error('店铺加载失败，请重试。');
            const result = await response.json();
            shippingShops.value = result.shops;
            shippingSelection.value = result.shops.map(shop => shop.shop_id);
          } catch (error) {
            shippingError.value = error.message || '店铺加载失败，请重试。';
          }
        }

        function selectShippingShops(mode) {
          const available = mode === 'first-two'
            ? shippingShops.value.slice(0, 2)
            : shippingShops.value;
          shippingSelection.value = available.map(shop => shop.shop_id);
        }

        async function prepareShippingBatch() {
          if (shippingBusy.value || !shippingDate.value || !shippingSelection.value.length) return;
          shippingBusy.value = true;
          shippingError.value = '';
          const request = {
            shop_ids: [...shippingSelection.value],
            ship_date: shippingDate.value
          };
          try {
            const response = await fetch('/api/simulation/batches', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(request)
            });
            const result = await response.json();
            if (!response.ok) {
              const message = typeof result.detail === 'string'
                ? result.detail
                : '生成失败，请核对日期和店铺后重试。';
              throw new Error(message);
            }
            shippingBatch.value = result;
            shippingPreparedDate.value = request.ship_date;
            shippingPreparedShops.value = request.shop_ids;
          } catch (error) {
            shippingError.value = error.message || '生成失败，请重试。';
          } finally {
            shippingBusy.value = false;
          }
        }

        function shippingPdfUrl(groupId) {
          if (!shippingBatch.value) return '';
          const base = '/api/simulation/batches/'
            + encodeURIComponent(shippingBatch.value.batch_id) + '/pdf';
          return groupId ? base + '?' + new URLSearchParams({ group_id: groupId }) : base;
        }

        function formatShippingExclusion(reason) {
          const labels = {
            cancelled: '订单已取消',
            label_pending: '面单尚未生成',
            not_ready: '尚未满足发货条件'
          };
          return labels[reason] || reason || '暂不具备打印条件';
        }

        onMounted(fetchShippingShops);
        return {
          shippingShops, shippingSelection, shippingDate, shippingBatch,
          shippingBusy, shippingError, shippingPreparedDate,
          shippingExcluded, shippingSelectionChanged,
          fetchShippingShops, selectShippingShops,
          prepareShippingBatch, shippingPdfUrl, formatShippingExclusion
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
